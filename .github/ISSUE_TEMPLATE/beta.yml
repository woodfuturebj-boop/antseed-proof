name: External buyer beta
description: Request onboarding help for a real external AntSeed buyer.
title: "[Beta] Buyer onboarding"
labels: ["beta"]
body:
  - type: markdown
    attributes:
      value: |
        This beta is for independent external buyers. Do not submit private keys, seed phrases, API keys, or wallet credentials.

        You can request setup help before creating a buyer. When ready, pin this provider with:
        `antseed buyer connection set --peer c50de6922b00677c93007c01924586de887ced7b`
  - type: dropdown
    id: stage
    attributes:
      label: Current stage
      options:
        - I need help installing a buyer
        - My buyer is running but not funded
        - My buyer is funded but not pinned
        - The provider is pinned but my real workload fails
        - I completed a real external call
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - AntStation
        - OpenAI-compatible client
        - Codex
        - OpenCode
        - Aider
        - Continue
        - Cline
        - Kilo Code
        - Zoo Code
        - Goose
        - Cherry Studio
        - Chatbox
        - Claude Code
        - Pi
        - LangChain
        - Hermes
        - AntFeed MCP with CLI buyer (:8377)
        - AntFeed MCP with AntStation Desktop (:8378)
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Preferred model
      description: Start with claude-opus-4.6, first in AntSeed's latest official model-sales snapshot. For a high-volume alternative, minimax-m2.7 ranks eighth in the official token-volume snapshot. Confirm the signed live price before use.
      placeholder: claude-opus-4.6
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Intended use
      description: Briefly describe the real workload and expected usage frequency.
    validations:
      required: true
  - type: input
    id: buyer-hash
    attributes:
      label: Buyer peer SHA-256 (optional until installed)
      description: After your buyer exists, hash its peer ID locally and submit only the 64-character SHA-256, never a private key.
      placeholder: 64 hexadecimal characters
  - type: dropdown
    id: source
    attributes:
      label: Discovery source
      options:
        - AntSeed network browse
        - AntFeed MCP or Explorer
        - Provider connection page
        - GitHub
        - X / Twitter
        - Direct referral
        - Other
    validations:
      required: true
  - type: checkboxes
    id: independence
    attributes:
      label: Buyer declaration
      options:
        - label: I am not the seller operator and will not generate artificial volume or self-trading activity.
          required: true
        - label: I intend to run a real workload within 24 hours and will not send a verification or test prompt.
          required: true
